name: Linkmap
on:
  pull_request:
    paths: ['linkmap-kit/**', '.github/workflows/linkmap.yml']
  push:
    branches: [main]
    paths: ['linkmap-kit/**', '.github/workflows/linkmap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linkmap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linkmap-kit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: linkmap-kit/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
