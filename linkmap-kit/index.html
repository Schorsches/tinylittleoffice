<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The map lives in the address; no page may tell another site where it came from. -->
    <meta name="referrer" content="no-referrer" />
    <!-- The production Content-Security-Policy <meta> is injected here by vite.config.ts (build only). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Linkmap</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Linkmap needs JavaScript: the map is decoded from the link inside your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
